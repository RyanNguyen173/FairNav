<!--
  FairNav - "Confirm your signup" email template, in the Vesper design
  system (see app/globals.css / the Vesper brand handoff). Paste this into
  Supabase Dashboard -> Authentication -> Emails -> Confirm signup.

  Supabase renders this as a Go template - {{ .ConfirmationURL }} below is
  replaced with the real, single-use confirmation link. Do not rename or
  remove it. Table-based layout + inline styles throughout (not a <style>
  block) since that's what actually renders consistently across email
  clients, unlike the rest of this app's CSS.

  The cat-mark logo is loaded from the deployed app (fairnav.vercel.app) -
  email clients can't reference local repo files, only public URLs. If the
  production domain ever changes, update the <img src> below to match.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email - FairNav</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f9fe;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f9fe;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="420" cellpadding="0" cellspacing="0" style="max-width:420px; width:100%; background-color:#ffffff; border:1px solid #dde8f5; border-radius:16px;">
            <tr>
              <td align="center" style="padding:40px 32px 32px;">
                <img src="https://fairnav.vercel.app/logo-cat.png" width="40" height="40" alt="" style="display:block; margin:0 0 16px;" />
                <p style="margin:0 0 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:13px; font-weight:600; letter-spacing:-0.02em; color:#5f6d83;">
                  FairNav
                </p>
                <h1 style="margin:0 0 8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:600; font-size:20px; letter-spacing:-0.02em; line-height:1.35; color:#0e1726;">
                  Confirm your email
                </h1>
                <p style="margin:0 0 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:14px; line-height:1.6; color:#4b586b;">
                  Click below to confirm your address and finish creating your FairNav account.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center" style="border-radius:999px; background-color:#0b2447;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:12px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:600; font-size:15px; letter-spacing:-0.01em; color:#ffffff; text-decoration:none; border-radius:999px;">
                        Confirm email
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:12px; line-height:1.6; color:#5f6d83;">
                  Or paste this link into your browser:<br />
                  <a href="{{ .ConfirmationURL }}" style="color:#1a5fb0; word-break:break-all;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:12px; color:#8494a7;">
            Didn't create a FairNav account? You can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
